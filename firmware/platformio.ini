[platformio]
default_envs = ld2451

[env]
platform = platformio/espressif32@6.12.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:ld2451]
build_flags = ${env.build_flags} -DRIDEGUARD_RADAR_LD2451
build_src_filter = +<*> -<drivers/radar/ld2417.cpp>

[env:ld2417]
build_flags = ${env.build_flags} -DRIDEGUARD_RADAR_LD2417
build_src_filter = +<*> -<drivers/radar/ld2451.cpp>
