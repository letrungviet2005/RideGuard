  /api/v1/devices/bind:
    post:
      operationId: bindDevice
      tags:
      - devices
      summary: Bind preregistered serial
      description: 'PROPOSED — not implemented. Transaction + device row lock + partial unique active binding. Unowned
        ACTIVE device: 201. Already owned by caller or valid replay: 200, nickname unchanged. Other owner: 409 DEVICE_UNAVAILABLE,
        no owner detail. Unknown/disabled/retired: 404 DEVICE_NOT_AVAILABLE. Closed original binding replay: 409
        BINDING_NO_LONGER_ACTIVE, even after same user rebinds. Serial is not physical possession proof. Full cached
        response retention is 7 days; minimal key/hash/resource marker persists for resource lifetime to prevent
