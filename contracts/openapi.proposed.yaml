openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: RideGuard MVP REST — PROPOSED / NOT IMPLEMENTED
  version: 0.2.0
  description: Design contract only. Deployed/implemented health API is separately defined in openapi.yaml. All
    paths here are unavailable in current code. JSON UTF-8, snake_case, UUID IDs, UTC RFC3339 Z timestamps, null
    for missing data; no trips, GPS recording, BLE proof, OTA or inference endpoints. Protected requests check session
    revocation/account status, not JWT signature alone. Examples are synthetic, not evidence of real devices. Normalize
    documented strings before validation; never transform passwords. Business errors include request_id here; current
    code error format remains unchanged. Maximum mutation body 32 KiB decoded UTF-8. Pagination default 20/max100,
    stable sort, integrity-protected caller/filter-scoped cursors. Configurable rate limits and retry policy are
    proposed, not installed.
servers:
- url: /
  description: Relative host only; no deployed business API or production origin is claimed. Paths include /api/v1.
security:
- bearerAuth: []
tags:
- name: auth
  description: PROPOSED MVP auth
- name: users
  description: PROPOSED MVP users
- name: devices
  description: PROPOSED MVP devices
- name: configuration
  description: PROPOSED MVP configuration
- name: reports
  description: PROPOSED MVP reports
- name: feedback
  description: PROPOSED MVP feedback
- name: admin
  description: PROPOSED MVP admin
paths:
  /api/v1/auth/register:
    post:
      operationId: register
      tags:
      - auth
      summary: Register USER account
      description: 'PROPOSED — not implemented. Server assigns USER/ACTIVE. Duplicate normalized email: 409 EMAIL_UNAVAILABLE.
        Does not log in; call login. No default admin account.'
      x-status: proposed
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 00000000-0000-4000-8000-000000000001
                email: viet@example.invalid
                full_name: Việt
                role: USER
                status: ACTIVE
                created_at: '2026-11-06T03:00:00Z'
                updated_at: '2026-11-06T03:00:00Z'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      requestBody:
        required: true
        description: JSON UTF-8, max 32 KiB decoded body. Normalize documented strings then validate; passwords
          are not normalized. Unknown properties rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: viet@example.invalid
              full_name: Việt
              password: Example-only-password-2026
        x-max-decoded-bytes: 32768
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - auth
      summary: Log in using client-specific token transport
      description: 'PROPOSED — not implemented. Access TTL 900s; session absolute lifetime <=30 days. admin_web
        requires ADMIN and trusted Origin/CSRF header; creates HttpOnly Secure refresh cookie, never body refresh
        token. Bad credentials/locked user: generic 401.'
      x-status: proposed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                mobile:
                  value:
                    access_token: synthetic.access.token.not-valid
                    refresh_token: synthetic-refresh-token-not-a-real-secret
                    token_type: Bearer
                    expires_in: 900
                    user:
                      id: 00000000-0000-4000-8000-000000000001
                      email: viet@example.invalid
                      full_name: Việt
                      role: USER
                      status: ACTIVE
                      created_at: '2026-11-06T03:00:00Z'
                      updated_at: '2026-11-06T03:00:00Z'
                admin_web:
                  value:
                    access_token: synthetic.access.token.not-valid
                    token_type: Bearer
                    expires_in: 900
                    user:
                      id: 00000000-0000-4000-8000-000000000001
                      email: viet@example.invalid
                      full_name: Việt
                      role: ADMIN
                      status: ACTIVE
                      created_at: '2026-11-06T03:00:00Z'
                      updated_at: '2026-11-06T03:00:00Z'
          headers:
            Set-Cookie:
              description: 'Only admin_web: rg_refresh=<opaque>; HttpOnly; Secure; Path=/api/v1/auth; SameSite=Lax
                for proposed same-site deployment. Cross-site topology needs explicit None + Secure, strict Origin/CORS/CSRF
                review. Not configured today.'
              schema:
                type: string
              example: rg_refresh=synthetic-cookie-value; HttpOnly; Secure; Path=/api/v1/auth; SameSite=Lax
            Cache-Control:
              schema:
                type: string
                const: no-store
              example: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security: []
      parameters:
      - $ref: '#/components/parameters/ClientType'
      - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        description: JSON UTF-8, max 32 KiB decoded body. Normalize documented strings then validate; passwords
          are not normalized. Unknown properties rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: viet@example.invalid
              password: Example-only-password-2026
              client_name: Android phone
        x-max-decoded-bytes: 32768
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags:
      - auth
      summary: Rotate refresh token
      description: PROPOSED — not implemented. Body-auth mobile or cookie-auth admin_web, never anonymous. Atomic
        single-use rotation within original absolute expiry (not sliding). Replay revokes entire family. Check account/session
        on every use; web branch requires ADMIN.
      x-status: proposed
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                mobile:
                  value:
                    access_token: synthetic.access.token.not-valid
                    refresh_token: synthetic-refresh-token-not-a-real-secret
                    token_type: Bearer
                    expires_in: 900
                    user:
                      id: 00000000-0000-4000-8000-000000000001
                      email: viet@example.invalid
                      full_name: Việt
                      role: USER
                      status: ACTIVE
                      created_at: '2026-11-06T03:00:00Z'
                      updated_at: '2026-11-06T03:00:00Z'
                admin_web:
                  value:
                    access_token: synthetic.access.token.not-valid
                    token_type: Bearer
                    expires_in: 900
                    user:
                      id: 00000000-0000-4000-8000-000000000001
                      email: viet@example.invalid
                      full_name: Việt
                      role: ADMIN
                      status: ACTIVE
                      created_at: '2026-11-06T03:00:00Z'
                      updated_at: '2026-11-06T03:00:00Z'
          headers:
            Set-Cookie:
              description: 'Only admin_web: rg_refresh=<opaque>; HttpOnly; Secure; Path=/api/v1/auth; SameSite=Lax
                for proposed same-site deployment. Cross-site topology needs explicit None + Secure, strict Origin/CORS/CSRF
                review. Not configured today.'
              schema:
                type: string
              example: rg_refresh=synthetic-cookie-value; HttpOnly; Secure; Path=/api/v1/auth; SameSite=Lax
            Cache-Control:
              schema:
                type: string
                const: no-store
              example: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      security:
      - {}
      - refreshCookie: []
        csrfProtection: []
      x-authentication-required: true
      x-token-transport:
        mobile: Mandatory refresh_token body; cookies ignored; empty security alternative means body auth, NOT anonymous
          access.
        admin_web: 'Mandatory refresh cookie AND X-CSRF-Protection: 1 AND trusted Origin; body must be {}.'
      parameters:
      - $ref: '#/components/parameters/ClientType'
      - $ref: '#/components/parameters/CsrfProtection'
      requestBody:
        required: true
        description: JSON UTF-8, max 32 KiB decoded body. Normalize documented strings then validate; passwords
          are not normalized. Unknown properties rejected.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            examples:
              mobile:
                value:
                  refresh_token: synthetic-refresh-token-not-a-real-secret
              admin_web:
                value: {}
        x-max-decoded-bytes: 32768
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - auth
      summary: Revoke current session family
      description: PROPOSED — not implemented. Revoke family identified by body/cookie credential; clear cookie
        for web. Repeated logout with same identifiable retired credential returns 204 within retention; unknown
        credential 401. Does not require an unexpired access token.
      x-status: proposed
      responses:
        '204':
          description: Success
          headers:
            Set-Cookie:
              description: Clear web refresh cookie with matching Path/domain policy.
              schema:
                type: string
              example: rg_refresh=; Max-Age=0; HttpOnly; Secure; Path=/api/v1/auth; SameSite=Lax
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
