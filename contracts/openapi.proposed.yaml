components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (proposed)
      description: 15 minute access token plus authoritative session/account revocation checks.
    refreshCookie:
      type: apiKey
      in: cookie
      name: rg_refresh
      description: admin_web only; HttpOnly Secure cookie, maximum absolute 30 day session lifetime.
    csrfProtection:
      type: apiKey
      in: header
      name: X-CSRF-Protection
      description: admin_web cookie flow requires literal 1 plus trusted Origin; value is not a secret. CORS exact
        origins only.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: 'Opaque integrity-protected cursor bound to caller, route, sort and filters. Invalid/tampered/mismatched
        cursor: 400.'
      example: opaque-synthetic-cursor
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000004
      description: 'UUID scoped to authenticated user+method+route+key. Retain 7 days after success. Same validated/normalized
        payload: replay after fresh authorization/state check, no duplicate. Different payload: 409 IDEMPOTENCY_CONFLICT.
        Closed original binding: 409 BINDING_NO_LONGER_ACTIVE. Full response cache expires after 7 days; retain
        minimal key/hash/resource tombstone for the resource lifetime. After cache expiry return 409 IDEMPOTENCY_KEY_EXPIRED,
        with BINDING_NO_LONGER_ACTIVE taking precedence for closed binding. Never silently treat an expired key
        as a new operation. Same-key success replay is 200; permission/state is checked first. Canonical request
        hashing includes defaults for omitted optional fields (nickname=null), sorted object keys, UTF-8 and the
        documented string normalization.'
    ClientType:
      name: X-Client-Type
      in: header
      required: true
      schema:
        type: string
        enum:
        - mobile
        - admin_web
      example: mobile
    CsrfProtection:
      name: X-CSRF-Protection
      in: header
      required: false
      schema:
        type: string
        const: '1'
      example: '1'
      description: Required for admin_web login/refresh/logout; strict Origin validation + non-simple JSON/header
        + credentialed exact-origin CORS. Not a secret. Deployment origins/SameSite must be approved before enabling
        cookies.
    device_id:
      name: device_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000002
    session_id:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000004
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000001
    feedback_id:
      name: feedback_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 00000000-0000-4000-8000-000000000004
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        status:
          type: integer
          minimum: 400
          maximum: 599
          readOnly: true
        code:
          type: string
          minLength: 1
          maxLength: 64
          readOnly: true
        message:
          type: string
          minLength: 1
          maxLength: 500
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
      required:
      - status
      - code
      - message
      - request_id
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Trim and lowercase entire address; no provider-specific dot/plus rewriting. MVP does not
            change email.
          readOnly: true
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S(?:[\s\S]*\S)?$
          description: Trim before validation; 1–100 Unicode characters.
          readOnly: true
        role:
          type: string
          enum:
          - USER
          - ADMIN
          readOnly: true
        status:
          type: string
          enum:
          - ACTIVE
          - LOCKED
          readOnly: true
        created_at:
          type: string
          format: date-time
          pattern: Z$
          description: RFC 3339 UTC, serialized with Z suffix.
          readOnly: true
        updated_at:
          type: string
          format: date-time
          pattern: Z$
          description: RFC 3339 UTC, serialized with Z suffix.
          readOnly: true
      required:
      - id
      - email
      - full_name
      - role
      - status
      - created_at
      - updated_at
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Trim and lowercase entire address; no provider-specific dot/plus rewriting. MVP does not
            change email.
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^\S(?:[\s\S]*\S)?$
          description: Trim before validation; 1–100 Unicode characters.
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12–128 Unicode characters; never trim, normalize, truncate or echo.
      required:
      - email
      - full_name
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Trim and lowercase entire address; no provider-specific dot/plus rewriting. MVP does not
            change email.
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12–128 Unicode characters; never trim, normalize, truncate or echo.
        client_name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 100
          default: null
      required:
      - email
      - password
    RefreshRequest:
      oneOf:
      - $ref: '#/components/schemas/MobileRefreshRequest'
      - $ref: '#/components/schemas/WebRefreshRequest'
      description: 'X-Client-Type=mobile requires refresh_token body and ignores cookies. admin_web requires {}
        body plus rg_refresh cookie and X-CSRF-Protection: 1; refresh_token in body rejected.'
    MobileRefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
          description: Opaque high-entropy credential; example values are synthetic, never valid credentials.
      required:
      - refresh_token
    WebRefreshRequest:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    MobileTokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 4096
          readOnly: true
        refresh_token:
          type: string
          minLength: 32
          maxLength: 4096
          readOnly: true
        token_type:
          type: string
          const: Bearer
          readOnly: true
        expires_in:
          type: integer
          const: 900
          readOnly: true
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - user
    WebTokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 1
          maxLength: 4096
          readOnly: true
        token_type:
          type: string
          const: Bearer
          readOnly: true
        expires_in:
          type: integer
          const: 900
          readOnly: true
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - token_type
      - expires_in
      - user
    TokenResponse:
      oneOf:
      - $ref: '#/components/schemas/MobileTokenResponse'
      - $ref: '#/components/schemas/WebTokenResponse'
      description: Mobile response includes refresh_token. admin_web response excludes it; Set-Cookie carries rotated
        refresh token. Transport selected by X-Client-Type, never inferred from body alone.
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Trim and lowercase entire address; no provider-specific dot/plus rewriting. MVP does not
            change email.
      required:
      - email
    Message:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          readOnly: true
      required:
      - message
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      properties:
        reset_token:
          type: string
          minLength: 32
          maxLength: 4096
          writeOnly: true
          description: Opaque high-entropy credential; example values are synthetic, never valid credentials.
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12–128 Unicode characters; never trim, normalize, truncate or echo.
